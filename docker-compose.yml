networks:
  ccp_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    networks: [ccp_net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccp}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ccp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [ccp_net]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Prod pulls :latest; `docker compose up --build` builds locally with the same tag.
    image: ${DOCKER_USERNAME:-local}/${APP_IMAGE_NAME:-customer-communication-platform}:latest
    build:
      context: .
    restart: unless-stopped
    networks: [ccp_net]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ccp}?schema=public&connection_limit=30&pool_timeout=10
      REDIS_URL: redis://redis:6379
      # Better Auth uses these to sign session cookies and validate the
      # request origin. BETTER_AUTH_URL must match the public Caddy origin
      # exactly (scheme + host) — anything else fails the trustedOrigins
      # check on signin endpoints.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # AES-256-GCM key for per-team Meta secret envelope encryption.
      # Rotating this without re-encrypting Team rows breaks every team's WhatsApp integration.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # We sit behind one trusted reverse proxy (Caddy on the host). The
      # rate limiter in middleware.ts uses this to pick the right XFF entry.
      TRUSTED_PROXY_HOPS: "1"
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      AUTOMATION_WORKER_CONCURRENCY: ${AUTOMATION_WORKER_CONCURRENCY:-5}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      # Bind to loopback only — Caddy on the host is the public ingress.
      # Without 127.0.0.1, this would publish on 0.0.0.0 and the app would
      # be reachable directly on http://<vps-ip>:3000, bypassing Caddy
      # (no TLS, no security headers, no rate limit on a real proxy hop).
      # Postgres and Redis above already follow this pattern.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
