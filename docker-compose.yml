# Dev/prod stack.
#
# Single internal network. Only `app` publishes a port to the host; Postgres
# is reachable from the host on 127.0.0.1:5433 for Prisma Studio + migrations,
# and from `app` on the docker network as `postgres:5432`.

networks:
  ccp_net:
    driver: bridge

volumes:
  postgres_data:
  # Persisted attachment storage. lib/media-storage.ts writes inbound +
  # outbound media here keyed by team + wamid. Survives container restarts
  # and `docker compose up --build`. Wipe with `docker volume rm`.
  ccp_media:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [ccp_net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccp}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to 127.0.0.1 so the host's `npm run dev` can connect for migrations
    # and Prisma Studio. 5433 (not 5432) to avoid colliding with a system
    # postgres install — adjust DATABASE_URL accordingly.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ccp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ccp_net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ccp}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      MEDIA_STORAGE_PATH: /var/lib/ccp/media
    volumes:
      - ccp_media:/var/lib/ccp/media
    ports:
      - "${APP_PORT:-3000}:3000"
