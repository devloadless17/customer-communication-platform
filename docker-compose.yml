networks:
  ccp_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    networks: [ccp_net]
    # /dev/shm is where Postgres puts parallel-query workers' shared memory.
    # Docker's default 64MB cap surfaces as `could not resize shared memory
    # segment` on busy systems — bumping to 256MB matches what production
    # tuning guides recommend for a ≥2GB-RAM Postgres. Safe to keep even on
    # small VPS since shm is allocated on-demand from page cache.
    shm_size: 256mb
    # On an 8GB VPS, Postgres + Redis + web + api can theoretically over-
    # subscribe RAM (web/api each carry --max-old-space-size=4096). Caps
    # turn a runaway process into a contained OOMKilled signal instead of
    # taking the whole VPS down. Numbers reflect the actual budget — bump
    # for any service that hits its cap legitimately in production.
    mem_limit: 1500m
    mem_reservation: 512m
    # Tuning for the 8GB-VPS pilot scale. Defaults (shared_buffers=128MB,
    # work_mem=4MB, effective_cache_size=4GB) are too conservative for the
    # mem_limit above and leave perf on the table once 20-30 agents are
    # querying the inbox list concurrently. Numbers below are tuned to:
    #   - shared_buffers: ~25% of mem_limit — Postgres community guidance
    #   - effective_cache_size: 50-75% — what the planner assumes the OS
    #     page cache will give it; conservative to avoid over-estimation
    #   - work_mem: per sort/hash, not per query — multiplied by parallel
    #     workers × concurrent connections; 8MB × 35 pool slots = 280MB
    #     worst case, well inside the cap
    #   - max_connections: 120, leaves headroom past the 35 the two pg.Pools
    #     reserve (api max=25 + web max=10) so a one-off psql or
    #     `prisma migrate deploy` doesn't hit the cap
    # log_min_duration_statement = 250ms surfaces slow queries to docker
    # logs without flooding on normal traffic.
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=120
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
    # Cap docker's json-file driver so a chatty `log_min_duration_statement`
    # day can't fill the disk. 3 files × 50MB = 150MB ceiling per service.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccp}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ccp}"]
      # Docker 25+ runs probes every `start_interval` during the
      # `start_period` window, so `service_healthy` flips as soon as
      # Postgres actually accepts a connection (~500ms-1s) instead of
      # waiting a full `interval`. start_period is required by docker
      # compose v2's schema validator when start_interval is set.
      # Steady-state probing still runs at `interval` to avoid noise.
      start_period: 30s
      start_interval: 500ms
      interval: 30s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [ccp_net]
    # --appendonly yes: AOF durability (~1s loss window).
    # --maxmemory + allkeys-lru: graceful eviction before the container's
    # 256m hard cap turns into an OOMKilled. BullMQ working set is tiny
    # (job IDs + small metadata) so 200mb is well above steady state; the
    # ceiling exists so a runaway pub/sub or stuck stream evicts cold
    # entries instead of crashing the queue.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # See postgres healthcheck above for start_interval rationale.
      # redis-cli PING returns in <50ms once redis is accepting clients.
      # start_period required by compose v2 schema when start_interval set.
      start_period: 10s
      start_interval: 500ms
      interval: 30s
      timeout: 3s
      retries: 5
    # BullMQ working set is tiny — workflow jobs are pointers, not bulk
    # data. 256MB is well above what Redis ever uses for the pilot scale;
    # the cap mostly catches a runaway pub/sub or a stuck stream.
    mem_limit: 256m
    mem_reservation: 64m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # NOTE: The standalone `migrate` one-shot service was folded into api's
  # startup on 2026-05-19. Schema migrations now run as the first step of
  # the api container's CMD (see the `command:` override below). web depends
  # on api being healthy, which structurally implies migrations completed.
  # Trade-off accepted: web can no longer boot in parallel with the schema
  # migration phase — but web also can't serve requests without api, so the
  # serialization happened anyway at runtime. Reduces the operator-visible
  # container count from 5 to 4.

  app:
    # Prod pulls :latest-web; `docker compose up --build` builds locally with
    # the same tag. apps/web/Dockerfile carries the Next.js build output +
    # the `next start` entrypoint.
    image: ${DOCKER_USERNAME:-local}/${APP_IMAGE_NAME:-customer-communication-platform}:latest-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Forwarded into `next build` so the client bundle has the right
        # Socket.io target. Runtime env (below) can't help here — Next.js
        # inlines NEXT_PUBLIC_* at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    networks: [ccp_net]
    depends_on:
      # api owns the migration step (runs as the first thing in its CMD)
      # so web only boots after api is healthy — guarantees schema is
      # current before Next.js boots its Prisma client (which caches
      # schema metadata on first connect). postgres + redis dependencies
      # are inherited transitively through api.
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ccp}?schema=public
      # No REDIS_URL here on purpose: the web process serves RSC reads + Better
      # Auth pages only. BullMQ + Socket.io live in the api service. validateEnv
      # treats REDIS_URL as api-only, so web boots without it.
      # Better Auth uses these to sign session cookies and validate the
      # request origin. BETTER_AUTH_URL must match the public Caddy origin
      # exactly (scheme + host) — anything else fails the trustedOrigins
      # check on signin endpoints.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # AES-256-GCM key for per-team Meta secret envelope encryption.
      # Rotating this without re-encrypting Team rows breaks every team's WhatsApp integration.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # We sit behind one trusted reverse proxy (Caddy on the host). The
      # rate limiter in middleware.ts uses this to pick the right XFF entry.
      TRUSTED_PROXY_HOPS: "1"
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # NEXT_PUBLIC_API_URL is intentionally NOT set at runtime. Next.js
      # inlines NEXT_PUBLIC_* into the client bundle at `next build` (see
      # the `args:` block above) — setting it here at runtime would do
      # nothing for the browser and just adds noise to docker inspect.
      # Server-side target for RSC fetches + server actions. apps/web calls
      # apps/api over this URL to read pages + run state mutations. Distinct
      # from NEXT_PUBLIC_API_URL because the browser uses the public origin
      # (same-host through Caddy) while the web container reaches the api
      # container directly over the internal docker network.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000}
      # Shared secret for the cross-process cache-revalidate bridge —
      # NestJS POSTs to /api/internal/revalidate when a catalog mutates,
      # this endpoint requires the same secret. Must match the value
      # on the api service. validateEnv requires this in prod.
      INTERNAL_BUS_SECRET: ${INTERNAL_BUS_SECRET}
      # Post-Phase-5: Next.js owns auth pages + RSC reads only. The NestJS
      # api container owns everything else (REST, Socket.io, webhooks, the
      # workflow worker, audit/analytics/dispatch). No env-toggle here for
      # those ownerships any more — they're structural, not flagged.
    ports:
      # Bind to loopback only — Caddy on the host is the public ingress.
      # Without 127.0.0.1, this would publish on 0.0.0.0 and the app would
      # be reachable directly on http://<vps-ip>:3000, bypassing Caddy
      # (no TLS, no security headers, no rate limit on a real proxy hop).
      # Postgres and Redis above already follow this pattern.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Next.js + Prisma. --max-old-space-size=4096 is the heap ceiling;
    # 2GB mem_limit is conservative because RSS exceeds heap (native
    # bindings, buffers, V8 metadata). Bump if next start ever OOM-kills
    # in steady state.
    mem_limit: 2g
    mem_reservation: 768m
    # Same probe shape as api below — gives compose dependents a real
    # "is web up" signal beyond `docker ps` PID liveness. start_period
    # is short because the web CMD is just `node apps/web/server.js`
    # (boots in 2-3s); the schema is guaranteed current by the time we
    # get here because `depends_on: api: service_healthy` above only
    # passes after api's CMD has finished `prisma migrate deploy`.
    # start_interval probes every 500ms during start_period so the
    # container is marked healthy the instant Next.js answers, instead
    # of waiting a full `interval` cycle.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      start_interval: 500ms
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    # Default 10s would SIGKILL Next.js mid-flush on `systemctl stop`.
    # 30s gives lifecycle hooks (Prisma disconnect, RSC cache flush) time
    # to wind down cleanly. No BullMQ workers here so we don't need the
    # api's 100s — just enough margin to be polite.
    stop_grace_period: 30s
    # Cap docker's json-file driver — 3 files × 100MB = 300MB ceiling per
    # service. Web tends to log more than the api (RSC server logs +
    # Better Auth request logs) so size is higher than the others.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ---- NestJS API ---------------------------------------------------------
  # Sits next to `app` (Next.js) on a different port. Caddy on the host
  # routes `/api/*`, `/socket.io/*`, `/webhooks/*` here; `/`, `/_next/*`,
  # `/api/auth/*` go to `app`.
  #
  # Separate Dockerfile from `app` (apps/api/Dockerfile vs apps/web/
  # Dockerfile) so CI builds both images in parallel and the api image
  # doesn't ship the Next.js bundle it never runs. Owns: REST, Socket.io,
  # Meta webhooks, BullMQ workers, audit/analytics event subscribers,
  # workflow dispatcher.
  api:
    image: ${DOCKER_USERNAME:-local}/${APP_IMAGE_NAME:-customer-communication-platform}:latest-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    networks: [ccp_net]
    depends_on:
      # api owns schema migrations (runs `prisma migrate deploy` as the
      # first step of its CMD — see the `command:` override below). Without
      # waiting for postgres-healthy, the CLI would error on connect; we
      # gate on it explicitly here now that there's no separate `migrate`
      # service inheriting the dependency.
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # Separate pg.Pool from `app`'s (both hit the same Postgres). The api
      # owns all REST + Socket.io + workers, so its pool is the larger one
      # (max: 25 in db.service.ts vs web's 10). Pool size lives in code, not
      # this URL — see the DATABASE_URL note on the `app` service above.
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ccp}?schema=public
      REDIS_URL: redis://redis:6379
      # Better Auth secrets — used by SessionGuard to call auth.api.getSession
      # against the same Session table the Next.js side writes to. Both must
      # match `app` exactly or session validation fails silently.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      TRUSTED_PROXY_HOPS: "1"
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      # Post-Phase-4: api owns the workflow worker by default. Override
      # with API_RUN_WORKER_INLINE=0 if scaling demands an external worker
      # container (run `docker compose --profile worker up worker` then).
      # Workflow worker + media sweeper run in-process by default. Override
      # to 0 only if scaling demands an external worker container — but
      # that's a future-state setup; nothing under `profiles` runs the
      # worker today (worker.ts and the old `worker` service were removed
      # post-Phase-5 cleanup).
      RUN_WORKER_INLINE: ${API_RUN_WORKER_INLINE:-1}
      WORKFLOW_WORKER_CONCURRENCY: ${WORKFLOW_WORKER_CONCURRENCY:-5}
      # Per-team max concurrent workflow steps. Stops one busy team from
      # starving every other team's queue.
      WORKFLOW_PER_TEAM_CONCURRENCY: ${WORKFLOW_PER_TEAM_CONCURRENCY:-2}
      # Outbound-webhook delivery worker concurrency + retention + orphan-
      # recovery sweeper grace (each one HTTP POST, idempotent retry on 5xx).
      WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-10}
      WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
      WEBHOOK_ORPHAN_GRACE_MS: ${WEBHOOK_ORPHAN_GRACE_MS:-300000}
      # Require X-Webhook-Timestamp + reject >5min replays on incoming
      # workflow-webhook posts. Set 0 only for legacy senders.
      WORKFLOW_WEBHOOK_REQUIRE_TIMESTAMP: ${WORKFLOW_WEBHOOK_REQUIRE_TIMESTAMP:-1}
      # safe-fetch SSRF defense. Set 1 ONLY in dev (hits a local receiver).
      INTEGRATIONS_ALLOW_PRIVATE_HOSTS: ${INTEGRATIONS_ALLOW_PRIVATE_HOSTS:-0}
      # Shared secret for the cache-revalidate bridge — same value as the
      # web service. validateEnv requires this in prod.
      INTERNAL_BUS_SECRET: ${INTERNAL_BUS_SECRET}
      # Where this process posts cache-revalidate calls to the Next.js
      # process. Defaults to the docker DNS for the web service; override
      # only if the topology changes.
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://app:3000}
      # Optional: tunable Meta Graph fetch timeout. Default 15s.
      META_FETCH_TIMEOUT_MS: ${META_FETCH_TIMEOUT_MS:-}
      # In-app /api/dev/emit endpoint that spoofs Meta webhooks for
      # local testing. MUST NOT be set in production — uncommenting this
      # in prod would let any authenticated user inject inbound events.
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-}
    ports:
      # Loopback-only — Caddy is the public ingress (same posture as `app`).
      - "127.0.0.1:${API_PORT:-4000}:4000"
    # Migrate-then-serve. Replaces the standalone `migrate` service so the
    # operator sees 4 long-running containers instead of 5 (the migrate
    # one-shot landed in `docker compose ps -a` as Exited and added visual
    # noise without actually running).
    #
    # Three load-bearing details:
    #   1. `cd /app` for the migrate step — that's where prisma.config.ts
    #      + prisma/schema.prisma live. Dockerfile WORKDIR is /app/apps/api
    #      because node's resolution needs to walk api's node_modules first
    #      for @swc-node/register; we leave the runtime CWD there and
    #      switch only for the prisma CLI invocation.
    #   2. `exec node …` — replaces the shell with node so PID 1 is node,
    #      not sh. SIGTERM from docker stop reaches node directly and the
    #      manual shutdown handler in main.ts fires; BullMQ workers drain
    #      cleanly (lockDuration=90s, see lib/workflows/worker.ts). Without
    #      `exec`, sh sits as PID 1 and SIGTERM forwarding becomes
    #      shell-implementation-dependent — irreversible Meta sends would
    #      double-fire on restart.
    #   3. `prisma migrate deploy` is idempotent (no-op on a current DB)
    #      so a restart loop doesn't churn the schema. A real migration
    #      failure exits non-zero before exec, the container fails to
    #      start, and docker's restart-policy + systemd's StartLimitBurst
    #      catch the loop the same way the old migrate service did.
    command:
      - sh
      - -c
      - |
        (cd /app && pnpm prisma migrate deploy) && \
        exec node -r @swc-node/register src/main.ts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      # See web/postgres above — start_interval flips service_healthy
      # the instant NestJS answers (~3-5s with swc-node) instead of
      # waiting for the next `interval` tick.
      start_interval: 500ms
      interval: 30s
      timeout: 3s
      retries: 3
      # 120s start_period: api's CMD now runs `prisma migrate deploy`
      # before exec'ing node (see the `command:` block above), so a fresh
      # DB's first migration can take 30-60s and a multi-migration deploy
      # against a stale DB can stack longer. start_interval still probes
      # every 500ms during start_period, so a no-op `migrate deploy` on
      # a current DB still flips healthy in ~3-5s — the long window only
      # matters on first-deploy or after a schema change.
      start_period: 120s
    # Higher than `app` because the api carries the workflow runner,
    # BullMQ worker, Socket.io fanout, and audit/analytics subscribers
    # on top of REST. 3GB tracks --max-old-space-size=4096 with margin
    # for native bindings + socket buffers under fan-out load.
    mem_limit: 3g
    mem_reservation: 1g
    # Must exceed BullMQ lockDuration (90s, see lib/workflows/worker.ts)
    # plus a tail for sweeper stop + queue close. Docker's default 10s
    # would SIGKILL the api mid-job, Redis would release the lock 90s
    # later, and the next process would re-execute the same workflow
    # step. systemd's TimeoutStopSec=120 (deploy/ccp.service) plus this
    # makes the whole graceful-shutdown chain hold together end-to-end.
    stop_grace_period: 100s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # NOTE: The standalone `worker` service was removed post-Phase-5 cleanup.
  # `worker.ts` is gone; the NestJS `api` container owns BullMQ workers
  # via `RUN_WORKER_INLINE=1` (default in this file). If a future scaling
  # cliff requires an external worker container, add it back here pointing
  # at the NestJS entrypoint with worker-only flags (no HTTP listener).
