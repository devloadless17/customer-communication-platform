# Production compose file.
#
# This file is shipped verbatim to /root/docker-compose.yml on the VPS — no
# sed rendering required. The dynamic bits (image tag, postgres password,
# secrets, etc.) come in through /root/.env via Docker Compose's normal
# variable substitution. That way the file in this repo IS the file on the
# VPS, byte-for-byte.
#
# Image source: Docker Hub. The deploy workflow builds + pushes
#   ${DOCKER_USERNAME}/${APP_IMAGE_NAME}:${APP_IMAGE_TAG}
# on every push to main, where APP_IMAGE_TAG is sha-<commit> for
# reproducibility (also tagged :latest for emergency manual rollback).
#
# The local docker-compose.yml (with `build: .`) stays in the repo root
# for `npm run prod:local` — local mirror builds from source for fast
# iteration. Production never builds; it pulls.

networks:
  ccp_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    networks: [ccp_net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccp}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to 127.0.0.1 — only the app container reaches it via the
    # bridge network. Host port lets you `prisma studio` etc. from the
    # VPS if you ever SSH in to debug.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ccp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [ccp_net]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Image ref assembled from /root/.env. APP_IMAGE_TAG is sha-<commit>
    # (rendered by the deploy workflow) so a redeploy without code changes
    # — i.e. workflow_dispatch — picks up the exact same bytes.
    image: ${DOCKER_USERNAME}/${APP_IMAGE_NAME:-customer-communication-platform}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [ccp_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ccp}?schema=public&connection_limit=30&pool_timeout=10
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
      # Required behind a reverse proxy on non-Vercel hosts — without it
      # Auth.js refuses to trust Caddy's X-Forwarded-Host header and the
      # middleware/page split causes a redirect loop.
      AUTH_TRUST_HOST: "true"
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      AUTOMATION_WORKER_CONCURRENCY: ${AUTOMATION_WORKER_CONCURRENCY:-5}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # Read by prisma/bootstrap-admin.ts on container start (between
      # migrate deploy and server boot). Source of truth for the superAdmin
      # login — rotate by changing the GitHub Secret and redeploying.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
    ports:
      - "${APP_PORT:-3000}:3000"
