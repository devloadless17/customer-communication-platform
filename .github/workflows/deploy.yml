# PR → typecheck only. Push to main → typecheck + build/push image + roll out to VPS.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_IMAGE_NAME: customer-communication-platform

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?schema=public
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-placeholder
      AUTH_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run typecheck

  deploy:
    if: github.event_name != 'pull_request'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stage deploy artifacts
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          APP_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          SUPER_ADMIN_NAME: ${{ secrets.SUPER_ADMIN_NAME }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _deploy
          cat > _deploy/.env <<EOF
          DOCKER_USERNAME=${DOCKER_USERNAME}
          APP_IMAGE_NAME=${APP_IMAGE_NAME}
          APP_IMAGE_TAG=${APP_IMAGE_TAG}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          NODE_ENV=production
          APP_PORT=3000
          NEXTAUTH_URL=https://${APP_DOMAIN}
          APP_PUBLIC_URL=https://${APP_DOMAIN}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          AUTH_SECRET=${NEXTAUTH_SECRET}
          AUTH_TRUST_HOST=true
          AUTOMATION_WORKER_CONCURRENCY=5
          UPLOADTHING_TOKEN=${UPLOADTHING_TOKEN}
          META_GRAPH_VERSION=v25.0
          SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
          SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
          SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME}
          EOF
          sed -e "s|__DOMAIN__|${APP_DOMAIN}|g" \
              -e "s|__ADMIN_EMAIL__|${ADMIN_EMAIL}|g" \
              deploy/Caddyfile.template > _deploy/Caddyfile
          grep -q '__DOMAIN__\|__ADMIN_EMAIL__' _deploy/Caddyfile && { echo "✗ unrendered placeholders"; exit 1; } || true
          cp docker-compose.yml _deploy/docker-compose.yml
          cp deploy/ccp.service _deploy/ccp.service
          ls -la _deploy/

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "_deploy/.env,_deploy/Caddyfile,_deploy/docker-compose.yml,_deploy/ccp.service"
          target: /tmp/ccp-deploy
          strip_components: 1
          overwrite: true

      - uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -euo pipefail
            mv /tmp/ccp-deploy/docker-compose.yml /root/docker-compose.yml
            mv /tmp/ccp-deploy/.env              /root/.env
            mv /tmp/ccp-deploy/Caddyfile         /etc/caddy/Caddyfile
            mv /tmp/ccp-deploy/ccp.service       /etc/systemd/system/ccp.service
            rmdir /tmp/ccp-deploy || true
            chmod 600 /root/.env
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker compose -f /root/docker-compose.yml --env-file /root/.env pull app
            mkdir -p /var/log/caddy && chown -R caddy:caddy /var/log/caddy
            caddy validate --config /etc/caddy/Caddyfile
            systemctl daemon-reload
            systemctl enable --now ccp
            systemctl restart ccp
            systemctl reload-or-restart caddy

      - name: Wait for health
        env:
          HEALTH_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 3 "$HEALTH_URL" > /dev/null; then echo "✓ live"; exit 0; fi
            sleep 2
          done
          echo "✗ health never green in 60s"
          exit 1
