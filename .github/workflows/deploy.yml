# PR → typecheck only.
# Push to main → typecheck + (changes-detect + conditional builds + smoke +
#                ship + external health + auto-rollback on failure).
#
# Job graph (push to main):
#
#   typecheck ──────────────────────────────────────────┐
#   changes ─┬─→ build-web (if web changed) ─┐          │
#            └─→ build-api (if api changed) ─┴─→ smoke ─→ ship → wait-for-health → (rollback if red)
#
# Why this shape:
# - `changes` runs paths-filter to decide which images need rebuilding.
#   When only one app changed, the other build job is SKIPPED entirely —
#   the dominant time cost of a deploy is `next build`, so skipping it on
#   an api-only push saves ~3–5 minutes.
# - `changes` also handles fail-fast secret validation.
# - :previous-{web,api} is written at the END of `ship`, AFTER the health gate
#   proves the new images live (the "Promote shipped image to :previous" step).
#   It used to be retagged at the START of `changes` from registry :latest-*,
#   but :latest-* is pushed BEFORE Trivy/smoke/health — so a blocked deploy
#   could leave :previous-* pointing at an image that never served traffic,
#   poisoning the auto-rollback target. Promote-after-health makes :previous-*
#   always mean "last image that actually passed health".
# - `workflow_dispatch` forces a full rebuild (paths-filter is bypassed).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_IMAGE_NAME: customer-communication-platform

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-placeholder
      BETTER_AUTH_URL: http://localhost:3000
      ENCRYPTION_KEY: ci-placeholder-32-bytes-padding!!
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      # pnpm to match what the Dockerfiles + workspace use. Mixing npm here
      # produced a different node_modules layout than the image build (npm
      # hoists differently than pnpm), so "passes CI, breaks build" was a
      # latent risk. setup-node's pnpm cache key uses pnpm-lock.yaml.
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9  # v6.0.8
        with:
          version: 10.33.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate
      - run: pnpm run typecheck
      - run: pnpm run lint

  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.flags.outputs.web }}
      api: ${{ steps.flags.outputs.api }}
      any: ${{ steps.flags.outputs.any }}
      scope: ${{ steps.cache.outputs.scope }}
      prev: ${{ steps.cache.outputs.prev }}
    steps:
      # fetch-depth: 2 gives paths-filter the parent commit it diffs against
      # on push events. PRs use the merge base via GH API and don't need it.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 2

      # Fail-fast on missing secrets. GH Actions exports unset secrets as
      # EMPTY strings (not unset), so `set -u` won't catch a typo'd secret
      # name — we have to explicitly test for empty. This caught the
      # 2026-05-16 ENCRYPTION_KEY-missing incident.
      - name: Validate required GH secrets are non-empty
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTERNAL_BUS_SECRET: ${{ secrets.INTERNAL_BUS_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          # Postgres DB + user feed the smoke .env AND the on-VPS /opt/ccp/.env
          # rendering below. Empty values silently produce a broken DATABASE_URL
          # ("postgres://:@…/") that fails at boot in a confusing way — validate
          # them here with everything else.
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for v in ENCRYPTION_KEY BETTER_AUTH_SECRET INTERNAL_BUS_SECRET POSTGRES_PASSWORD \
                   R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET \
                   APP_DOMAIN ADMIN_EMAIL HEALTHCHECK_URL DOCKER_USERNAME DOCKER_PASSWORD \
                   POSTGRES_DB POSTGRES_USER \
                   VPS_HOST VPS_USER VPS_SSH_KEY; do
            [ -z "${!v:-}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '✗ missing GH Actions secret: %s\n' "${missing[@]}"
            exit 1
          fi
          # Dev escape hatches (ENABLE_DEV_TOOLS / INTEGRATIONS_ALLOW_PRIVATE_HOSTS)
          # are guarded at boot by apps/api/src/main.ts: prod + flag=1 hard-crashes
          # before any HTTP. We previously also checked here pre-deploy, but the
          # boot crash + auto-rollback already covers the misconfig path safely,
          # and the secrets.* refs tripped a permanent IDE lint warning since the
          # keys are intentionally undefined in repo settings. Defense-in-depth
          # without the noise: rely on main.ts + compose defaults (both 0/unset).
          echo "✓ all required GH secrets present"

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # NOTE: :previous-{web,api} is NO LONGER retagged here. It used to be
      # retagged from registry :latest-* at the START of every push — but
      # images are pushed to :latest-* BEFORE the Trivy gate and BEFORE
      # smoke/health, so a Trivy/smoke/health-blocked deploy left registry
      # :latest-* pointing at an image that NEVER served traffic. The next
      # push then retagged THAT unvetted image as :previous-*, poisoning the
      # auto-rollback target. :previous-* is now written at the END of the
      # `ship` job, AFTER the health gate proves the image is live — so
      # :previous-* always means "last image that actually served traffic".
      # See the "Promote shipped image to :previous" step on the ship job.

      # paths-filter decides which images need rebuilding. The `shared`
      # block uses a YAML anchor so both filters pick up monorepo-level
      # changes (deps, prisma, configs, the workflow itself, the
      # docker-compose file, etc.).
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'prisma/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'prisma.config.ts'
              - 'docker-compose.yml'
              - 'deploy/**'
              - '.github/workflows/deploy.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'prisma/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'prisma.config.ts'
              - 'docker-compose.yml'
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

      # workflow_dispatch should force full rebuild — operator explicitly
      # asked for it. Otherwise propagate paths-filter outputs.
      - id: flags
        env:
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_API: ${{ steps.filter.outputs.api }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "→ workflow_dispatch: forcing full rebuild"
          else
            echo "web=$FILTER_WEB" >> "$GITHUB_OUTPUT"
            echo "api=$FILTER_API" >> "$GITHUB_OUTPUT"
            if [ "$FILTER_WEB" = "true" ] || [ "$FILTER_API" = "true" ]; then
              echo "any=true" >> "$GITHUB_OUTPUT"
            else
              echo "any=false" >> "$GITHUB_OUTPUT"
            fi
            echo "→ web=$FILTER_WEB api=$FILTER_API"
          fi

      # Rotate buildx cache scope weekly. GHA cache is capped at 10GB per
      # repo with LRU eviction; without rotation the .next/cache mount
      # layer keeps growing within a single scope and cache-to upload time
      # creeps up. `prev` is a cache-from fallback so first build of a new
      # week restores from the previous week instead of cold rebuilding.
      # Each build job appends `-web`/`-api` to keep scopes distinct.
      - name: Compute weekly buildx cache scope
        id: cache
        run: |
          echo "scope=buildkit-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "prev=buildkit-$(date -u -d '7 days ago' +%G-W%V)" >> "$GITHUB_OUTPUT"

  build-web:
    if: needs.changes.outputs.web == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build + push web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}:latest-web
          # Bust ONLY the runtime apt-upgrade layer every deploy so debian
          # security fixes land immediately instead of waiting out the weekly
          # cache scope (+ prev-week fallback) — a mid-week fix (openssl
          # CVE-2026-45447) otherwise fails the Trivy gate on every deploy
          # until rotation. ~30s/build; expensive build stages stay cached.
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}
          cache-from: |
            type=gha,scope=${{ needs.changes.outputs.scope }}-web
            type=gha,scope=${{ needs.changes.outputs.prev }}-web
            type=gha,scope=buildkit-web
          cache-to: type=gha,mode=max,scope=${{ needs.changes.outputs.scope }}-web

      # CVE scan — only HIGH/CRITICAL with a fix available block the build.
      # Anything else lands in the action log for triage without breaking
      # deploys on transitively-deep CVEs that have no upstream patch.
      # `ignore-unfixed: true` is the key knob; without it noise drowns
      # signal and the team stops reading the report.
      - name: Trivy scan — web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}:latest-web
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  build-api:
    if: needs.changes.outputs.api == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build + push api image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}:latest-api
          # Same apt-layer bust as build-web — see the comment there.
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}
          cache-from: |
            type=gha,scope=${{ needs.changes.outputs.scope }}-api
            type=gha,scope=${{ needs.changes.outputs.prev }}-api
            type=gha,scope=buildkit-api
          cache-to: type=gha,mode=max,scope=${{ needs.changes.outputs.scope }}-api

      # Same CVE policy as build-web: only HIGH/CRITICAL with an upstream
      # fix block. See the rationale on the web side for why unfixed is
      # ignored.
      - name: Trivy scan — api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}:latest-api
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  smoke:
    # Run if at least one image was rebuilt and neither build failed.
    # `always() && !cancelled()` lets us run even when a sibling build job
    # was SKIPPED (e.g. only web changed → build-api skipped → smoke still
    # tests the new web image against the existing :latest-api).
    if: |
      always() && !cancelled() &&
      needs.changes.outputs.any == 'true' &&
      needs.changes.result == 'success' &&
      needs.build-web.result != 'failure' &&
      needs.build-api.result != 'failure'
    needs: [changes, build-web, build-api]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Render config bundle (NO SECRETS — artifact is repo-readable)
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          INTERNAL_BUS_SECRET: ${{ secrets.INTERNAL_BUS_SECRET }}
        run: |
          set -euo pipefail
          # Fail-fast: every secret listed in the `ship` job's env block
          # must already be present here (validated by the `changes` step),
          # but INTERNAL_BUS_SECRET is the one that's easy to forget on a
          # fresh repo setup — calling out explicitly.
          : "${INTERNAL_BUS_SECRET:?INTERNAL_BUS_SECRET secret is required — generate with: openssl rand -base64 32}"
          mkdir -p _deploy
          sed -e "s|__DOMAIN__|${APP_DOMAIN}|g" \
              -e "s|__ADMIN_EMAIL__|${ADMIN_EMAIL}|g" \
              deploy/Caddyfile.template > _deploy/Caddyfile
          grep -q '__DOMAIN__\|__ADMIN_EMAIL__' _deploy/Caddyfile && { echo "✗ unrendered placeholders"; exit 1; } || true
          cp docker-compose.yml _deploy/docker-compose.yml
          # Nightly pg_dump script — installed at /opt/ccp/pg-backup.sh by the
          # ship job and driven by a one-time cron line on the VPS (see
          # deploy/README.md "Backups"). Shipping every deploy keeps the
          # script in lockstep with the compose file it depends on.
          cp scripts/pg-backup.sh _deploy/pg-backup.sh
          chmod +x _deploy/pg-backup.sh
          # NOTE: ccp.service is intentionally NOT bundled — the stack is
          # driven directly by `docker compose` now, not systemd. The ship
          # job removes any legacy ccp unit still on the VPS.
          # NO .env in the artifact — uploaded artifacts are downloadable
          # by anyone with repo read access for the retention window. The
          # real /opt/ccp/.env is rendered ON THE VPS in the ship job
          # below, with secrets travelling over the encrypted SSH channel
          # and never touching CI-side disk.
          tar -czf ccp-deploy.tar.gz -C _deploy .

      # Smoke test still needs an .env to boot the prod-shaped stack. This
      # file lives ONLY inside the GHA runner — never in the artifact, never
      # uploaded. Real secrets are used so the smoke test catches any value-
      # specific issues (encryption-key length, malformed JWT signing key, …).
      - name: Write smoke .env (runner-local only)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          INTERNAL_BUS_SECRET: ${{ secrets.INTERNAL_BUS_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          cat > _deploy/.env <<EOF
          DOCKER_USERNAME=${DOCKER_USERNAME}
          APP_IMAGE_NAME=${APP_IMAGE_NAME}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          NODE_ENV=production
          APP_PORT=3000
          BETTER_AUTH_URL=https://${APP_DOMAIN}
          APP_PUBLIC_URL=https://${APP_DOMAIN}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          INTERNAL_BUS_SECRET=${INTERNAL_BUS_SECRET}
          R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET=${R2_BUCKET}
          META_GRAPH_VERSION=v25.0
          NEXT_PUBLIC_API_URL=
          EOF

      # Prove the EXACT images + env + compose we're about to ship can boot
      # together. `pull` grabs both images from the registry — when only
      # one was rebuilt this push, the other tag still resolves to the
      # previous deploy's image, which is the correct integration test.
      - name: Smoke-test stack with prod-shaped env
        working-directory: _deploy
        run: |
          set -euo pipefail
          echo "==> Pulling images from registry"
          docker compose --env-file .env pull
          echo "==> Booting CI stack"
          docker compose --env-file .env up -d
          echo "==> Waiting for app container to be healthy (≤180s)"
          # 180s budget. The chain is: api waits for postgres+redis healthy,
          # then runs `prisma migrate deploy` as the first step of its CMD,
          # then exec's node. api's start_period is 120s (covers a fresh-DB
          # migration that can rebuild indexes in 30-60s). web only flips
          # healthy after api flips healthy (depends_on chain), so we budget
          # api 120s + web's own ~5s boot + a margin = 180s.
          budget=180
          deadline=$((SECONDS + budget))
          while [ $SECONDS -lt $deadline ]; do
            app_id=$(docker compose --env-file .env ps -q app)
            if [ -z "$app_id" ]; then
              echo "✗ app container missing — compose never created it"
              docker compose --env-file .env logs
              exit 1
            fi
            state=$(docker inspect --format '{{.State.Status}}' "$app_id")
            health=$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || echo "none")
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "✗ app exited during smoke test (state=$state)"
              docker compose --env-file .env logs app
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              echo "✓ app healthy after ${SECONDS}s"
              break
            fi
            sleep 2
          done
          if [ "$health" != "healthy" ]; then
            echo "✗ app never reported healthy in ${budget}s"
            docker compose --env-file .env logs app
            exit 1
          fi

          # Deep probe — the Docker HEALTHCHECK only checks HTTP 200 via
          # wget, which means an api that returns `{ ok: false, db: false }`
          # would still flip healthy. Parse the api /health JSON to confirm
          # postgres + redis are genuinely reachable from the api process.
          # This is what catches "image boots but can't talk to its data
          # plane" — exactly the regression a healthcheck-only smoke misses.
          echo "==> Deep probe: api /health must report ok:true"
          api_id=$(docker compose --env-file .env ps -q api)
          if [ -z "$api_id" ]; then
            echo "✗ api container missing"
            docker compose --env-file .env logs
            exit 1
          fi
          # Wait up to 30s for api to be healthy too (web is independent).
          for i in $(seq 1 15); do
            api_health=$(docker inspect --format '{{.State.Health.Status}}' "$api_id" 2>/dev/null || echo "none")
            [ "$api_health" = "healthy" ] && break
            sleep 2
          done
          if [ "$api_health" != "healthy" ]; then
            echo "✗ api never reported healthy in 30s (state=$api_health)"
            docker compose --env-file .env logs api
            exit 1
          fi
          # Hit /health via docker exec so we don't need a published port.
          # jq isn't installed on the runner by default; use grep against
          # the canonical "ok":true substring instead.
          health_json=$(docker exec "$api_id" wget -qO- http://127.0.0.1:4000/health || true)
          echo "api /health: $health_json"
          echo "$health_json" | grep -q '"ok":true' || {
            echo "✗ api /health returned non-ok body"
            docker compose --env-file .env logs api
            exit 1
          }
          echo "✓ smoke passed: api ↔ postgres ↔ redis all reachable"

      - name: Tear down CI stack
        if: always()
        working-directory: _deploy
        run: docker compose --env-file .env down -v || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deploy-bundle
          path: ccp-deploy.tar.gz
          retention-days: 1
          if-no-files-found: error

  ship:
    # Skipped when nothing rebuilt (smoke skipped → smoke.result != 'success').
    if: |
      always() && !cancelled() &&
      needs.smoke.result == 'success' &&
      needs.typecheck.result == 'success'
    needs: [typecheck, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: deploy-bundle

      # Hostinger runs always-on edge DDoS scrubbing IN FRONT of the VPS. GitHub's
      # shared runner IPs intermittently get flagged and their SYNs are silently
      # dropped (→ "dial tcp :22: i/o timeout") — invisible to ufw/sshd because the
      # attempt never reaches the host (confirmed: no sshd log line for a failed
      # try). The scrub window is short (~1-2 min observed), so poll until the port
      # is reachable instead of failing and forcing a manual re-run. A genuinely
      # sustained block (rare) still exits non-zero after ~3.5 min, at which point a
      # re-run draws a fresh runner IP. This gate is purely additive — it never
      # touches the secret-bearing scp/ssh steps below.
      - name: Wait for VPS SSH to be reachable
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Port 22 — the scp/ssh-action steps below don't set a custom `port:`,
          # so they use SSH's default. Probe the same port the real steps use.
          host="$VPS_HOST"; port=22
          for i in $(seq 1 10); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
              echo "✓ $host:$port reachable (attempt $i/10)"
              exit 0
            fi
            echo "… $host:$port unreachable (attempt $i/10) — likely Hostinger edge scrubbing this runner IP; retrying in 15s"
            sleep 15
          done
          echo "::error::$host:$port never became reachable (~3.5min) — sustained edge scrub. Re-run the job (fresh runner IP) or move the ship job to a self-hosted runner."
          exit 1

      - uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634  # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ccp-deploy.tar.gz"
          target: /tmp/
          overwrite: true

      - name: Ship to VPS
        id: ship
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        env:
          # Non-secret config — propagated via SSH env channel so the script
          # can substitute them into the rendered /opt/ccp/.env. Same
          # channel as DOCKER_USERNAME below, just split for readability.
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          # Secrets — travel encrypted over the SSH tunnel from GH Actions
          # to the VPS, never written to a file in the CI runner, never
          # uploaded as an artifact. `cat > /opt/ccp/.env` on the VPS is
          # the only on-disk write.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          INTERNAL_BUS_SECRET: ${{ secrets.INTERNAL_BUS_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DOMAIN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,BETTER_AUTH_SECRET,ENCRYPTION_KEY,INTERNAL_BUS_SECRET,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -euo pipefail
            rm -rf /tmp/ccp-deploy
            mkdir -p /tmp/ccp-deploy
            tar -xzf /tmp/ccp-deploy.tar.gz -C /tmp/ccp-deploy

            # Render /opt/ccp/.env DIRECTLY on the VPS from secrets passed
            # over the SSH env channel. Secrets never touched CI-side disk
            # and were never in the uploaded artifact — this `cat` is the
            # only on-disk materialization.
            umask 077
            cat > /opt/ccp/.env <<EOF
            DOCKER_USERNAME=${DOCKER_USERNAME}
            APP_IMAGE_NAME=customer-communication-platform
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            NODE_ENV=production
            APP_PORT=3000
            BETTER_AUTH_URL=https://${APP_DOMAIN}
            APP_PUBLIC_URL=https://${APP_DOMAIN}
            BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
            ENCRYPTION_KEY=${ENCRYPTION_KEY}
            # Shared secret for the cross-process cache-revalidate bridge —
            # NestJS POSTs to /api/internal/revalidate on Next.js when a
            # catalog mutates; the endpoint requires this exact value.
            # validateEnv refuses to boot prod without it.
            INTERNAL_BUS_SECRET=${INTERNAL_BUS_SECRET}
            R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            R2_BUCKET=${R2_BUCKET}
            META_GRAPH_VERSION=v25.0
            # NEXT_PUBLIC_API_URL intentionally empty — Caddy fronts both
            # processes on a single origin so the browser falls back to
            # window.location for Socket.io.
            NEXT_PUBLIC_API_URL=
            EOF
            chmod 600 /opt/ccp/.env

            # Non-secret config files travel via the artifact (no secrets
            # inside them post-restructure). The `ccp` systemd unit is gone:
            # the stack is driven directly by `docker compose` (see below),
            # so there is no .service file to install any more.
            mv /tmp/ccp-deploy/docker-compose.yml /opt/ccp/docker-compose.yml
            # Snapshot the live Caddyfile BEFORE overwriting so auto-rollback
            # can revert the proxy config too — not just the images. When a
            # bad deploy changes BOTH (e.g. a new web-block health_uri that the
            # app gates with a 401), reverting images alone leaves the broken
            # new Caddyfile in place and the site stays dark. They must move
            # together. Restored by the "Auto-rollback" step below.
            #
            # RUN-SCOPED: clear any stale .prev from a PRIOR deploy generation
            # first, so `Caddyfile.prev` exists ONLY if THIS run snapshotted.
            # Without this, a ship failure BEFORE the cp below (tar extract,
            # .env render, compose mv) would let auto-rollback restore the
            # generation-N-1 Caddyfile over a still-current config — reverting
            # the proxy one generation too far while images stay current. The
            # rollback gates on /tmp/caddy-snapshotted-<sha> (written after the
            # cp) so it never restores a .prev this run didn't write.
            sudo rm -f /etc/caddy/Caddyfile.prev
            # Clear stale run markers from prior deploys (they accumulate in
            # /tmp on every successful deploy since only a rollback rm's its own).
            rm -f /tmp/caddy-snapshotted-* || true
            # No `|| true` on the cp: if the deploy user's sudoers allowlist is
            # out of lockstep (missing this cp), the snapshot must FAIL the
            # deploy LOUDLY rather than silently disarm the rollback's Caddyfile
            # restore. Keep deploy/README.md's allowlist in sync with this line.
            sudo cp -a /etc/caddy/Caddyfile /etc/caddy/Caddyfile.prev
            touch "/tmp/caddy-snapshotted-${{ github.sha }}"
            sudo mv /tmp/ccp-deploy/Caddyfile    /etc/caddy/Caddyfile
            install -m 0755 /tmp/ccp-deploy/pg-backup.sh /opt/ccp/pg-backup.sh

            # Install the nightly backup cron IDEMPOTENTLY. The script has
            # shipped for a while, but the only thing running it was a one-time
            # manual `crontab -e` line — so on any host where nobody added it,
            # backups silently never ran (first signal = a disaster with no
            # restore point). grep -Fv removes any prior pg-backup line, then we
            # append the current one, so re-deploys never stack duplicates and a
            # changed schedule self-updates. 03:17 UTC nightly; log to a file so
            # a failed dump is discoverable.
            CRON_LINE="17 3 * * * cd /opt/ccp && /opt/ccp/pg-backup.sh >> /opt/ccp/pg-backup.log 2>&1"
            # `|| true` is load-bearing under `set -euo pipefail`: on a host with
            # no user crontab, `crontab -l` exits 1 (suppressed) and the piped
            # `grep -Fv` then gets empty stdin and ALSO exits 1 — which pipefail
            # propagates and `set -e` turns into a silent deploy abort (exit 1,
            # no output, ~2s in). Swallowing that non-zero keeps the idempotent
            # filter-then-append working whether or not a crontab already exists.
            ( crontab -l 2>/dev/null | grep -Fv "/opt/ccp/pg-backup.sh" || true; echo "$CRON_LINE" ) | crontab -
            echo "✓ nightly pg-backup cron installed"

            rm -f /tmp/ccp-deploy.tar.gz
            rmdir /tmp/ccp-deploy || true

            # Decommission the old `ccp` systemd unit if it's still present
            # from a previous deploy. Idempotent: harmless once it's gone.
            # This is what made manual `docker stop` "bounce back" — the
            # unit's `docker compose up` + Restart=always recreated whatever
            # you stopped. Stopping it WITHOUT taking the containers down
            # (compose down happens below) avoids a double-bounce.
            if systemctl list-unit-files ccp.service >/dev/null 2>&1 \
               && systemctl cat ccp.service >/dev/null 2>&1; then
              sudo systemctl disable --now ccp.service || true
              sudo rm -f /etc/systemd/system/ccp.service
              sudo systemctl daemon-reload
              echo "✓ removed legacy ccp systemd unit"
            fi

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            sudo mkdir -p /var/log/caddy
            sudo chown -R caddy:caddy /var/log/caddy
            sudo caddy validate --config /etc/caddy/Caddyfile
            # reload-ONLY (not reload-or-restart): a fallback restart drops
            # every in-flight HTTPS connection, including the user reading
            # this deploy's CI logs. The validate above is the gate — if
            # config is malformed, fail the deploy here instead of triggering
            # a restart on the live host.
            sudo systemctl reload caddy

            # Drive the stack directly with docker compose (no systemd).
            # `up -d` recreates only the services whose image/config changed
            # (the new :latest pull → app/api recreate; postgres/redis stay
            # up if unchanged, keeping the data plane warm). `--remove-orphans`
            # drops any service removed from the compose file.
            cd /opt/ccp
            docker compose --env-file .env pull

            # Pre-migration snapshot. The api container runs `prisma migrate
            # deploy` as the FIRST step of its CMD during the `up` below, so the
            # schema moves FORWARD before the health gate runs. If a migration
            # applies-then-crashes the app, the auto-rollback step only swaps
            # CODE images (it is DB-unaware) → old code against the new schema.
            # The nightly cron dump can be up to ~24h stale; this gives a
            # recovery point seconds before the migration. Best-effort: a backup
            # blip warns but does NOT block the deploy (nightly dump is the
            # fallback). For destructive (drop/rename) migrations, prefer
            # expand-contract so :previous code stays schema-compatible.
            # Read ONLY the two vars we need, literally — do NOT `source` the
            # compose env-file. It is compose-format (KEY=value, unquoted), not
            # shell: `. ./.env` under `set -e` would EVALUATE every value, so a
            # password containing a shell metachar (& ` $ space) would abort the
            # ship step on every deploy (or worse). grep|cut takes the bytes
            # verbatim and never evaluates the password or any other line.
            POSTGRES_USER="$(grep -E '^POSTGRES_USER=' .env | head -n1 | cut -d= -f2-)"
            POSTGRES_DB="$(grep -E '^POSTGRES_DB=' .env | head -n1 | cut -d= -f2-)"
            : "${POSTGRES_USER:=app}"; : "${POSTGRES_DB:=ccp}"
            mkdir -p /opt/ccp/backups && chmod 700 /opt/ccp/backups
            PRE="/opt/ccp/backups/pre-deploy-${POSTGRES_DB}-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}.sql.gz"
            if docker compose --env-file .env exec -T postgres pg_dump \
                 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" \
                 --no-owner --no-privileges --clean --if-exists 2>/dev/null \
                 | gzip -9 > "$PRE.tmp"; then
              mv "$PRE.tmp" "$PRE"
              echo "✓ pre-migration snapshot: $PRE"
            else
              rm -f "$PRE.tmp"
              echo "⚠ pre-migration snapshot FAILED — proceeding (nightly dump is the fallback). If this deploy's migration misbehaves, a manual restore decision is required."
            fi

            docker compose --env-file .env up -d --remove-orphans

            # Reclaim disk: every deploy pulls a fresh :latest-{web,api},
            # orphaning the prior layers as dangling (untagged) images. This
            # is what was filling the VPS disk. `-f` skips the confirm prompt;
            # only DANGLING images are removed, so :latest-* and :previous-*
            # (needed for rollback) are untouched. Running containers and
            # their images are never pruned.
            docker image prune -f

      - name: Wait for health
        id: health
        env:
          HEALTH_URL: ${{ secrets.HEALTHCHECK_URL }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # 150s budget (75 × 2s). MUST exceed the api container's compose
          # start_period (120s) — that window exists precisely because a
          # stack-of-migrations `prisma migrate deploy` can take ~60-120s on a
          # meaty schema change. The old 60s budget timed out WHILE a healthy
          # deploy's migration was still running → tripped the auto-rollback
          # below → retagged :previous against the ALREADY-migrated schema →
          # Prisma threw on the now-mismatched client. The safety net created
          # the outage. 150s gives the migration its full window plus margin.
          green=0
          for i in $(seq 1 75); do
            if curl -fsS -m 3 "$HEALTH_URL" > /dev/null; then echo "✓ HEALTH_URL live after $((i*2))s"; green=1; break; fi
            sleep 2
          done
          if [ "$green" != 1 ]; then
            echo "✗ health never green in 150s"
            exit 1
          fi
          # ALSO assert the real user path through Caddy's DEFAULT (web) block.
          # HEALTH_URL hits /api/health (block 3 — NO active health check), so a
          # web upstream that Caddy's block-6 active `health_uri` probe has
          # marked DOWN is INVISIBLE to it. That blind spot is exactly how a
          # dark site (503 on every page) once shipped as a "green" deploy:
          # /api/health stayed 200 while `/` 503'd. `/` rides block 6, so a 503
          # here means the web upstream is unhealthy → fail → auto-rollback.
          # A normal unauthenticated `/` is a 302→/login (passes); only a real
          # Caddy 5xx / connection failure trips this.
          if [ -n "${APP_DOMAIN:-}" ]; then
            code=$(curl -s -o /dev/null -m 8 -w '%{http_code}' "https://$APP_DOMAIN/" || echo 000)
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "✗ public root https://$APP_DOMAIN/ returned $code — web upstream is dark"
              exit 1
            fi
            echo "✓ public root https://$APP_DOMAIN/ returned $code"
          fi
          exit 0

      # Warm-up the public origin via the api path through Caddy. The
      # `Wait for health` step above hits HEALTHCHECK_URL (whatever the
      # operator configured — possibly an internal probe). This step
      # explicitly hits the api `/health` endpoint over the public domain
      # so we know Caddy's TLS terminator is fully provisioned before the
      # very first Meta webhook lands — first request after a fresh deploy
      # can otherwise race ACME challenge resolution on a brand-new cert.
      - name: Warm up public origin
        if: success()
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          if [ -z "$APP_DOMAIN" ]; then
            echo "APP_DOMAIN secret not set — skipping warm-up"
            exit 0
          fi
          for i in $(seq 1 20); do
            if curl -fsS -m 5 "https://$APP_DOMAIN/api/health" > /dev/null; then
              echo "✓ public origin warm after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          # Soft-fail: the deploy is still healthy per HEALTH_URL above.
          # Cert provisioning sometimes takes >60s on first request to a new
          # domain; better to log + continue than block the deploy.
          echo "⚠ public origin not yet warm — Caddy may still be provisioning TLS"

      # Superadmin seed is idempotent (upsert in seeds/seed-superadmin.ts).
      # Running it on every deploy is the safest posture: first deploy
      # bootstraps the row, subsequent deploys are no-ops. The previous
      # "manual SSH and remember" flow failed once already (auto-memory:
      # "Superadmin seed is manual"); automating closes that footgun.
      # Credentials are hardcoded in the seed script (single-operator pilot;
      # change after first login).
      - name: Bootstrap superadmin (idempotent)
        if: success()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/ccp
            # Use the `app` container's node — it already has @prisma/client
            # generated and the seed script. The container's CMD only runs
            # next start; one-off exec doesn't disturb it.
            app_id=$(docker compose ps -q app)
            if [ -z "$app_id" ]; then
              echo "⚠ no app container running — skipping superadmin seed"
              exit 0
            fi
            docker exec "$app_id" pnpm run db:seed:superadmin
            echo "✓ superadmin seed complete"

      # Promote the just-shipped images to :previous-* — ONLY after the health
      # gate proved them live. This is the rollback-target write that used to
      # run (wrongly) at the start of the `changes` job, BEFORE Trivy/smoke/
      # health, which could poison :previous-* with an image that never served
      # traffic. Now :previous-* is always "the last image that actually passed
      # health", which is exactly what auto-rollback should fall back to.
      # Gated on the health step succeeding (not just `success()`) so a deploy
      # that limped to here some other way can't write a bad rollback target.
      # Manifest-only copy from the verified-live :latest-* — no layer transfer.
      - name: Promote shipped image to :previous
        if: steps.health.outcome == 'success'
        env:
          REPO: ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          for variant in web api; do
            if docker buildx imagetools inspect "$REPO:latest-$variant" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "$REPO:previous-$variant" "$REPO:latest-$variant"
              echo "✓ promoted verified-live $REPO:latest-$variant → :previous-$variant"
            else
              echo "no :latest-$variant in registry (unexpected post-ship) — skipping"
            fi
          done

      # Fires when external health failed OR the ship step itself failed. The
      # ship step swaps the live Caddyfile + runs `docker compose up` BEFORE
      # the health check; if it aborts mid-way, the health step is SKIPPED
      # (outcome 'skipped', not 'failure') and gating on health alone would
      # leave the new (possibly broken) images + swapped Caddyfile live with no
      # revert. Rolling back on a ship failure that never touched the VPS is
      # harmless — it just re-asserts the :previous images (== current) and
      # skips the Caddyfile restore because no run-scoped snapshot marker exists
      # (the ship step writes /tmp/caddy-snapshotted-<sha> only AFTER it
      # actually replaces the proxy config — a ship failure before that point
      # leaves the live Caddyfile untouched, so there's nothing to revert).
      # Retags both :previous-{web,api} → :latest-{web,api} on the VPS,
      # recreates via docker compose, restores Caddyfile.prev only when this run
      # snapshotted it. Back on last-good in ~30s.
      - name: Auto-rollback on health or ship failure
        if: always() && (steps.health.outcome == 'failure' || steps.ship.outcome == 'failure')
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          REPO: ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_IMAGE_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,REPO
          script: |
            set -euo pipefail
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            for variant in web api; do
              if ! docker buildx imagetools inspect "$REPO:previous-$variant" >/dev/null 2>&1; then
                echo "✗ no :previous-$variant tag in registry — cannot auto-rollback. Manual fix required."
                exit 1
              fi
              docker pull "$REPO:previous-$variant"
              docker tag "$REPO:previous-$variant" "$REPO:latest-$variant"
              # CRITICAL: push the rollback tag back to the registry, NOT just
              # retag locally. Without this, the registry's :latest-$variant
              # still points at the broken image — and the NEXT deploy's
              # `changes` job runs `buildx imagetools create :previous-$variant
              # :latest-$variant` which OVERWRITES the known-good :previous-
              # $variant with the still-broken :latest-$variant. After that,
              # one re-deploy reaches "rollback target = previously-rolled-back
              # broken image". Push keeps registry truth aligned with the
              # actual recovered state.
              docker push "$REPO:latest-$variant"
            done
            cd /opt/ccp
            docker compose --env-file .env up -d --remove-orphans

            # P3009 detection. If THIS deploy's migration failed mid-apply,
            # Prisma recorded a FAILED row in _prisma_migrations, and every
            # subsequent `prisma migrate deploy` — INCLUDING the one the
            # rolled-back :previous-api image just ran in its boot CMD — exits
            # with P3009 ("migrate found failed migrations") and crash-loops.
            # The image swap above cannot recover this failure class on its own.
            # Surface it loudly with the exact manual-resolve runbook instead of
            # the rollback falsely reporting success. (Give the api a moment to
            # attempt its boot migrate, then scan its recent logs.)
            sleep 8
            api_logs="$(docker compose --env-file .env logs --tail=120 api 2>&1 || true)"
            if printf '%s' "$api_logs" | grep -q 'P3009'; then
              echo "::error::P3009 — a failed migration is blocking the api boot. The image rollback CANNOT clear this; the rolled-back container crash-loops on the same FAILED _prisma_migrations row."
              echo "::error::RUNBOOK: SSH to the VPS and either (a) restore the pre-deploy snapshot /opt/ccp/backups/pre-deploy-*-$(echo "${{ github.sha }}").sql.gz then redeploy, OR (b) inspect + resolve the marker:"
              echo "::error::  docker compose --env-file .env run --rm --entrypoint sh api -c 'cd /app && pnpm prisma migrate status'"
              echo "::error::  docker compose --env-file .env run --rm --entrypoint sh api -c 'cd /app && pnpm prisma migrate resolve --rolled-back <FAILED_MIGRATION_NAME>'"
              echo "::error::See deploy/README.md → 'Rolling back' → 'A migration that failed mid-apply (P3009)'."
            fi

            # Revert the proxy config too if the failed deploy changed it. A
            # rollback that restores images but keeps the NEW Caddyfile can
            # leave a working app behind a broken proxy (e.g. a health_uri the
            # rolled-back image doesn't satisfy → web upstream stays down →
            # site still 503s). /etc/caddy/Caddyfile.prev is snapshotted by the
            # ship step before it overwrites the live config.
            #
            # Gate on the RUN-SCOPED marker the ship step writes ONLY after a
            # successful snapshot THIS run. A bare `-f Caddyfile.prev` check
            # would restore a stale generation-N-1 snapshot when the ship step
            # failed BEFORE snapshotting (the .prev that the ship step's first
            # line, `rm -f Caddyfile.prev`, may not have cleared if even that
            # didn't run). The marker means: only restore the proxy config when
            # THIS deploy actually replaced it.
            SNAP_MARKER="/tmp/caddy-snapshotted-${{ github.sha }}"
            if [ -f "$SNAP_MARKER" ] && [ -f /etc/caddy/Caddyfile.prev ]; then
              sudo cp -a /etc/caddy/Caddyfile.prev /etc/caddy/Caddyfile
              if sudo caddy validate --config /etc/caddy/Caddyfile; then
                sudo systemctl reload caddy
                echo "✓ reverted /etc/caddy/Caddyfile to previous + reloaded Caddy"
              else
                echo "⚠ previous Caddyfile failed validation — left current config in place"
              fi
            else
              echo "ℹ this run did not snapshot the Caddyfile (ship failed before the proxy swap) — leaving live config untouched"
            fi
            rm -f "$SNAP_MARKER"
            echo "✓ rolled back to :previous-{web,api} (registry + local in sync)"
            # MIGRATION SAFETY NOTE (read before trusting this rollback):
            # this step swaps CODE images only — it does NOT revert any database
            # migration that already applied during `up`. If THIS deploy shipped
            # a migration, the rolled-back :previous code is now running against
            # a FORWARD-migrated schema and may 500 on schema-incompatible
            # queries. The pre-migration snapshot is at
            # /opt/ccp/backups/pre-deploy-*-<this-sha>.sql.gz — a human must
            # decide whether to restore it (see deploy/README.md "Rollback").
            echo "⚠ if this deploy included a DB migration, restore may be needed: see /opt/ccp/backups/pre-deploy-*-$(echo "${{ github.sha }}").sql.gz and deploy/README.md 'Rollback'"
