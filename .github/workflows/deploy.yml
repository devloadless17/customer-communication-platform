# Deploy to production on push to main.
#
# This workflow is BOTH the first-time provisioner AND the recurring deploy
# script — every step is idempotent, so the VPS converges to the same state
# regardless of where it starts. The only thing the operator does by hand is:
#
#   1) install docker + caddy + ufw (one shell session, done already)
#   2) paste the GHA public SSH key into /root/.ssh/authorized_keys
#   3) add the secrets listed in deploy/README.md to the repo
#
# After that, every push to main:
#   • rsyncs the repo to /opt/ccp/ (atomic-ish: new files arrive then --delete
#     removes orphans)
#   • renders /etc/ccp.env from GitHub Secrets — overwritten every deploy so
#     the live env file always matches what GitHub thinks should be there
#   • renders /etc/caddy/Caddyfile from deploy/Caddyfile.template
#   • installs/refreshes /etc/systemd/system/ccp.service
#   • builds the new app image (old containers still serving)
#   • restarts the ccp service + reloads Caddy
#   • polls https://<domain>/api/health from this runner — exercises DNS +
#     Caddy + cert + app end-to-end. Fails the workflow if it doesn't go
#     green within 2 min.

name: Deploy

on:
  push:
    branches: [main]
  # Manual re-run from the Actions tab — useful for redeploying after
  # rotating a secret without an empty commit.
  workflow_dispatch:

# Serialize deploys: never run two restarts at once, and don't cancel one
# mid-flight (cancellation could leave /opt/ccp half-synced or the service
# half-restarted).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Environments scope deploy approvals + secrets. Optional: in
    # Settings → Environments → production you can require a reviewer
    # before this job runs.
    environment:
      name: production
      url: https://${{ secrets.APP_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        # Private key on disk, host key pinned via ssh-keyscan so first connect
        # doesn't prompt for trust. Cleanup in a separate always() step at the
        # end so a key file doesn't linger if a middle step fails.
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Render production .env
        # Built on the runner, never committed, scp'd over in a later step.
        # `umask 077` and `chmod 600` keep the file off other runner
        # processes' eyes (though GitHub-hosted runners are ephemeral
        # single-tenant — this is defense in depth).
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          cat > ccp.env <<EOF
          # Generated by .github/workflows/deploy.yml — DO NOT EDIT BY HAND.
          # The next deploy will overwrite this file from GitHub Secrets.

          NODE_ENV=production
          APP_PORT=3000

          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=30&pool_timeout=10

          NEXTAUTH_URL=https://${APP_DOMAIN}
          APP_PUBLIC_URL=https://${APP_DOMAIN}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          AUTH_SECRET=${NEXTAUTH_SECRET}

          REDIS_URL=redis://redis:6379
          AUTOMATION_WORKER_CONCURRENCY=5

          UPLOADTHING_TOKEN=${UPLOADTHING_TOKEN}

          META_GRAPH_VERSION=v25.0
          EOF
          chmod 600 ccp.env

      - name: Render Caddyfile
        # Inline sed substitution — domain and email aren't secrets in the
        # cryptographic sense, but they're per-deploy config that belongs
        # in GitHub vars/secrets not in the committed template.
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          sed -e "s|__DOMAIN__|${APP_DOMAIN}|g" \
              -e "s|__ADMIN_EMAIL__|${ADMIN_EMAIL}|g" \
              deploy/Caddyfile.template > Caddyfile.rendered

      - name: Sync code to /opt/ccp
        # --delete keeps /opt/ccp matching the repo exactly (orphans get
        # removed). The excludes save bandwidth + avoid clobbering anything
        # the VPS owns (the .env was never in the repo anyway — paranoia).
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # Make sure the destination exists. mkdir -p is idempotent.
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/ccp'
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='storage' \
            --exclude='ccp.env' \
            --exclude='Caddyfile.rendered' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$SSH_USER@$SSH_HOST:/opt/ccp/"

      - name: Ship rendered config files
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        # Two scp's because they land in different paths and the second
        # needs a directory that's owned by caddy on some setups. Both are
        # idempotent overwrites.
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key ccp.env "$SSH_USER@$SSH_HOST:/etc/ccp.env"
          scp -i ~/.ssh/deploy_key Caddyfile.rendered "$SSH_USER@$SSH_HOST:/etc/caddy/Caddyfile"

      - name: Install systemd unit + build + restart
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        # All steps idempotent so this run works as both first-time install
        # and recurring deploy. `set -e` bails before restart if the build
        # blows up — we don't restart a broken image into prod.
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail

            echo "▸ lock down /etc/ccp.env perms"
            chmod 600 /etc/ccp.env

            echo "▸ install/refresh systemd unit"
            cp /opt/ccp/deploy/ccp.service /etc/systemd/system/ccp.service
            systemctl daemon-reload
            systemctl enable ccp

            echo "▸ build new app image (old containers keep serving)"
            docker compose --env-file /etc/ccp.env -f /opt/ccp/docker-compose.yml build --pull app

            echo "▸ validate Caddy config before reloading"
            caddy validate --config /etc/caddy/Caddyfile

            echo "▸ restart app via systemd"
            systemctl restart ccp

            echo "▸ reload Caddy (zero-downtime — keeps existing connections)"
            systemctl reload caddy

            echo "▸ remote work done"
          REMOTE

      - name: Wait for health endpoint
        env:
          HEALTH_URL: ${{ secrets.HEALTHCHECK_URL }}
        # Polls the public URL — exercises DNS + Caddy + cert + app at
        # once. 5s × 24 = 2 min cap. The first deploy can take longer
        # because Let's Encrypt provisions the cert on Caddy's first
        # request — bump this if that ever wedges things.
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -fsS -m 5 "$HEALTH_URL" > /tmp/health.json; then
              echo "✓ live"
              cat /tmp/health.json
              exit 0
            fi
            echo "($i/24) waiting for $HEALTH_URL ..."
            sleep 5
          done
          echo "✗ health check never passed within 2 min"
          echo "▸ debug on the VPS:"
          echo "    ssh root@${{ secrets.VPS_HOST }}"
          echo "    journalctl -u ccp -n 100 --no-pager"
          echo "    journalctl -u caddy -n 50 --no-pager"
          exit 1

      - name: Cleanup runner artifacts
        # always() — wipe secrets-bearing files even if a previous step
        # failed. GitHub-hosted runners are ephemeral, but this keeps the
        # blast radius tight if anything inspects the workspace.
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ccp.env Caddyfile.rendered
