packages:
  - "apps/*"
  - "packages/*"

# Native modules pnpm is allowed to run install scripts for. Without these
# listed, bcrypt + ffmpeg postinstalls are skipped and the api crashes on
# first hash / first media transcode. Lives here (not in package.json) per
# pnpm 10.x: the `pnpm` field in package.json is no longer read.
onlyBuiltDependencies:
  - bcrypt
  - "@ffmpeg-installer/ffmpeg"
  - "@ffmpeg-installer/linux-x64"

# Resolution overrides — pin transitive deps that otherwise float to
# versions with known issues. effect: workflow engine guards against
# breakage on pre-3.20 releases. picomatch / esbuild: bundler perf +
# CVE fixes that lockfile-merging will sometimes downgrade.
overrides:
  effect: ^3.20.0
  picomatch: ^4.0.4
  esbuild: ^0.28.0
