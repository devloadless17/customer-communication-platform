packages:
  - "apps/*"
  - "packages/*"

# Native modules pnpm is allowed to run install scripts for. Without these
# listed, bcrypt + ffmpeg postinstalls are skipped and the api crashes on
# first hash / first media transcode. Lives here (not in package.json) per
# pnpm 10.x: the `pnpm` field in package.json is no longer read.
onlyBuiltDependencies:
  - bcrypt
  - "@ffmpeg-installer/ffmpeg"
  - "@ffmpeg-installer/linux-x64"

# Resolution overrides live in package.json `pnpm.overrides` (the ONLY source
# pnpm 10.x reads here — confirmed against pnpm-lock.yaml). An `overrides:` key
# in this file is silently ignored, so it is intentionally NOT defined here to
# avoid a second, dead source of truth. To pin a transitive dep, edit
# package.json `pnpm.overrides` and run `pnpm install`.
