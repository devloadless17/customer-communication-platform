<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget test page</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 40px; background: #f8fafc; color: #0f172a; }
      .card { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; }
      h1 { margin: 0 0 6px; font-size: 20px; }
      h2 { font-size: 14px; margin: 22px 0 8px; }
      p { color: #475569; line-height: 1.6; font-size: 14px; }
      input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
      button, a.btn { display: inline-block; margin-top: 10px; margin-right: 8px; padding: 9px 15px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font: inherit; cursor: pointer; text-decoration: none; }
      a.btn.ghost { background: #eef2ff; color: #4f46e5; }
      #inline-host { margin-top: 14px; height: 520px; max-width: 440px; }
      code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Widget test page</h1>
      <p>Paste a widget public key (<code>wc_pk_…</code>) from Settings → Website chat, then pick a deploy mode.</p>
      <input id="key" placeholder="wc_pk_..." />

      <h2>1) Floating bubble</h2>
      <button onclick="loadFloating()">Load bubble (bottom-right)</button>
      <button onclick="loadFloating('left','Chat with us')">Bubble left + label</button>

      <h2>2) Open from your own link (launcher hidden)</h2>
      <button onclick="loadTrigger()">Load (hidden)</button>
      <a href="#" class="btn ghost" onclick="window.CCPWebchat&&CCPWebchat.open();return false">💬 Chat with us</a>

      <h2>3) Inline — embedded in this page</h2>
      <button onclick="loadInline()">Load inline</button>
      <div id="inline-host"></div>

      <p id="hint" style="font-size: 13px"></p>
    </div>
    <script>
      function key() { var k = document.getElementById("key").value.trim(); if (!k) document.getElementById("hint").textContent = "Enter a public key first."; return k; }
      function inject(attrs) {
        if (document.getElementById("ccp-webchat-root")) { document.getElementById("hint").textContent = "Widget already loaded — reload the page to try another mode."; return; }
        var s = document.createElement("script"); s.src = "/widget.js"; s.defer = true;
        for (var a in attrs) s.setAttribute(a, attrs[a]);
        document.body.appendChild(s);
      }
      function loadFloating(pos, label) { var k = key(); if (!k) return; var a = { "data-webchat-key": k }; if (pos) a["data-webchat-position"] = pos; if (label) a["data-webchat-label"] = label; inject(a); }
      function loadTrigger() { var k = key(); if (!k) return; inject({ "data-webchat-key": k, "data-webchat-launcher": "off" }); document.getElementById("hint").textContent = "Loaded hidden — click the “Chat with us” link above."; }
      function loadInline() { var k = key(); if (!k) return; inject({ "data-webchat-key": k, "data-webchat-target": "#inline-host" }); }
    </script>
  </body>
</html>
